# The story of andersein.com, running: robot photo → vision → UNS ← PLC → rules → robot → dashboard.
#
#   docker compose up --build        then open http://localhost:8000 (console) and :3000 (Grafana)
#   docker compose run --rm tree     the whole namespace, right now
#
# Vision: by default the inspector answers from dataset/respuestas-de-prueba.json (no
# model needed). With a real model (Ollama on the PC, see config/inspector.ollama.yaml):
#   INSPECTOR_CONFIG=inspector.ollama.yaml docker compose up --build

x-service: &service
  build: .
  image: industrial-uns-demo:local
  restart: unless-stopped
  depends_on: [broker]
  environment:
    MQTT_HOST: broker
    WORLD_URL: http://world:8080
    # Speed the story up for a quick look: see "Quick start" in the README
    WORLD_TIME_SCALE: ${WORLD_TIME_SCALE:-1}
    ROBOT_SPEED: ${ROBOT_SPEED:-1.5}      # m/s along the route of config/planta.yaml
    ROBOT_DWELL_S: ${ROBOT_DWELL_S:-3}    # time at each stop
    ROBOT_ACTION_S: ${ROBOT_ACTION_S:-4}  # time to close the valve

services:
  broker:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # The physical plant: PT-104 wired to a Siemens S7 PLC, local gauge PI-104, manual valve XV-104.
  world:
    <<: *service
    command: ["uns-world"]
    volumes:
      - ./config/planta.yaml:/app/config/planta.yaml:ro

  # Reads the PLC and publishes PT-104 straight into its UNS path.
  plc-gateway:
    build: https://github.com/aseinotegi/plc-mqtt-gateway.git#main
    image: plc-gateway:uns-demo
    restart: unless-stopped
    depends_on: [broker, world]
    environment:
      PLC_HOST: world
      PLC_PORT: "1102"
      MQTT_HOST: broker
    volumes:
      - ./config/plc-gateway.yaml:/config/config.yaml:ro

  robot:
    <<: *service
    command: ["uns-robot"]
    depends_on: [broker, world]
    volumes:
      - ./config/planta.yaml:/app/config/planta.yaml:ro

  # Reads the robot's photos with a multimodal model and publishes what it saw to the UNS.
  inspector:
    build: https://github.com/aseinotegi/poi-vision-inspector.git#main
    image: poi-vision-inspector:uns-demo
    restart: unless-stopped
    depends_on: [broker, world]
    environment:
      MQTT_HOST: broker
      POI_PROVIDER_URL: ${POI_PROVIDER_URL:-}
      POI_PROVIDER_MODEL: ${POI_PROVIDER_MODEL:-}
    extra_hosts: ["host.docker.internal:host-gateway"]  # Ollama running on the PC
    volumes:
      - ./config/${INSPECTOR_CONFIG:-inspector.yaml}:/app/config/inspector.yaml:ro
      - ./dataset/respuestas-de-prueba.json:/app/config/respuestas.json:ro

  rules:
    <<: *service
    command: ["uns-rules"]
    environment:
      MQTT_HOST: broker
      RULES_FILE: /app/config/rules.yaml
    volumes:
      # read-write for the console, which edits it; the engine reloads it when it changes
      - ./config/rules.yaml:/app/config/rules.yaml

  # The plant's HMI: the robot on the map, the PLC, the namespace, the rules and the vision.
  console:
    build: https://github.com/aseinotegi/plant-console.git#main
    image: plant-console:uns-demo
    restart: unless-stopped
    depends_on: [broker, world, rules]
    # It edits config/rules.yaml on this machine, whoever owns the file. On Linux you can
    # run it as yourself instead: CONSOLE_UID=$(id -u) docker compose up
    user: "${CONSOLE_UID:-0}"
    environment:
      MQTT_HOST: broker
      WORLD_URL: http://world:8080
      RULES_FILE: /app/config/rules.yaml
    ports: ["8000:8000"]
    volumes:
      - ./config/rules.yaml:/app/config/rules.yaml

  historian:
    <<: *service
    command: ["uns-historian"]
    depends_on: [broker, timescaledb]
    environment:
      MQTT_HOST: broker
      DATABASE_URL: postgresql://uns:uns@timescaledb:5432/uns

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: uns
      POSTGRES_PASSWORD: uns
      POSTGRES_DB: uns
    ports: ["5432:5432"]

  grafana:
    image: grafana/grafana-oss:11.3.0
    depends_on: [timescaledb]
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/linea-104.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # On demand: docker compose run --rm tree
  tree:
    <<: *service
    command: ["uns-tree"]
    restart: "no"
    profiles: [tools]
