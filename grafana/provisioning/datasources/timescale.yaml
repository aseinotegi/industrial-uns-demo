apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    url: timescaledb:5432
    user: grafana  # read-only, created by the historian
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: uns
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
      maxOpenConns: 5  # the role allows 10 and each query 5 s: Grafana cannot hog the database
      maxIdleConns: 2
    isDefault: true
