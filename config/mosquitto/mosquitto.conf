# Plant broker: nobody gets in without a user, and each user can only touch its own
# part of the namespace (acl). Passwords are hashed at start (see docker-compose.yml).
per_listener_settings false
allow_anonymous false
password_file /tmp/mosquitto-passwd
acl_file /tmp/mosquitto-acl

listener 1883
persistence false
sys_interval 5            # $SYS/broker/... statistics, for the console's live view
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true  # who connects and who is refused, in the broker log
