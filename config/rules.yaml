# Rules evaluated on every live value of the UNS. Edited from the console (Reglas) or by hand.
#
#   mode        notify: raise the alarm only · act: also send the orders in on_trigger
#   when        all conditions must hold, each value no older than max_age_s
#               compare with above / below (numbers) or equals / not_equals (any value)
#   clear_when  any condition clears the alarm (hysteresis: clear below a lower value)
#   on_trigger  only orders of the allowed list (RULES_ORDERS)

rules:
- id: sobrepresion-linea-104
  description: Sobrepresión en la línea 104 confirmada por visión y PLC
  mode: act
  when:
  - {topic: planta1/exterior/pi-104/presion, above: 6.0, max_age_s: 45, quality: good}
  - {topic: planta1/exterior/pt-104/presion, above: 6.0, max_age_s: 30}
  clear_when:
  - {topic: planta1/exterior/pt-104/presion, below: 5.5}
  on_trigger:
  - {topic: planta1/exterior/xv-104/orden, value: cerrar}

- id: nivel-alto-t-101
  description: El depósito T-101 pasa del 90 %
  mode: notify
  when:
  - {topic: planta1/tanques/lt-101/nivel, above: 90.0, max_age_s: 30}
  clear_when:
  - {topic: planta1/tanques/lt-101/nivel, below: 80.0}

- id: extintor-ext-12
  description: El robot ha visto el extintor EXT-12 fuera de su soporte o sin presión
  mode: notify
  when:
  - {topic: planta1/exterior/ext-12/estado, equals: NOK, quality: good}
  clear_when:
  - {topic: planta1/exterior/ext-12/estado, equals: OK}

- id: extintor-ext-14
  description: El robot ha visto el extintor EXT-14 fuera de su soporte o sin presión
  mode: notify
  when:
  - {topic: planta1/control/ext-14/estado, equals: NOK, quality: good}
  clear_when:
  - {topic: planta1/control/ext-14/estado, equals: OK}
